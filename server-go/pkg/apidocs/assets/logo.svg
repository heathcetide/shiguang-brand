    <path d="M128 78 L138 88 L128 98"/>
  </g>
  <!-- Center slash -->
  <line x1="108" y1="72" x2="92" y2="104" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round"/>
  <!-- Text lines -->
  <g stroke="#94A3B8" stroke-width="5" stroke-linecap="round">
    <line x1="68" y1="120" x2="132" y2="120"/>
    <line x1="68" y1="136" x2="116" y2="136"/>
    <line x1="68" y1="152" x2="124" y2="152"/>
