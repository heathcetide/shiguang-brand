<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="doc" x1="40" y1="40" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- Document body -->
  <rect x="48" y="36" width="104" height="128" rx="12" fill="url(#doc)"/>
  <!-- Folded corner -->
  <path d="M128 36 L152 36 L152 60 Z" fill="#CBD5E1"/>
