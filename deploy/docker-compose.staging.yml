name: dietdigidose-staging

# API, migrations and optional scanner use exactly the same Go executable.
x-go-build: &go-build
  context: ..
  dockerfile: server-go/docker/Dockerfile
  args:
    SERVER_GIT_SHA: ${CANDIDATE_GIT_SHA:?set full candidate commit SHA in deploy/.env}

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dietdigidose
      POSTGRES_USER: dietdigidose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - staging_go_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dietdigidose -d dietdigidose"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [staging]

  migrate:
    build: *go-build
    restart: "no"
    command: ["-migrate"]
    env_file:
      - ${SERVER_ENV_FILE:-server.env}
    environment:
      DATABASE_DRIVER: postgresql
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?set DATABASE_MIGRATION_URL in deploy/.env}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?set DATABASE_MIGRATION_URL in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [staging]

  api:
    build: *go-build
    restart: unless-stopped
    env_file:
      - ${SERVER_ENV_FILE:-server.env}
    environment:
      NODE_ENV: production
      APP_APP_ENVIRONMENT: prod
      DEPLOYMENT_ENV: staging
      APP_SERVER_PORT: "9090"
      DATABASE_DRIVER: postgresql
      APP_DATABASE_AUTO_MIGRATE: "0"
      APP_EMBEDDED_WORKER_ENABLED: "0"
      APP_UPSTREAM_EXPRESS: "off"
      REQUIRE_HTTPS: "1"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      MEDIA_LOCAL_ROOT: /data/media
    volumes:
      - staging_media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [staging]

  # Opt in: docker compose ... --profile interventions up -d
  # Inbox scanning only: NOT Express's push/email/media/plan-maintenance workers.
  worker:
    build: *go-build
    profiles: [interventions]
    restart: unless-stopped
    command: ["-worker"]
    healthcheck:
      disable: true
    env_file:
      - ${SERVER_ENV_FILE:-server.env}
    environment:
      APP_APP_ENVIRONMENT: prod
      NODE_ENV: production
      DATABASE_DRIVER: postgresql
      APP_DATABASE_AUTO_MIGRATE: "0"
      PROACTIVE_INTERVENTIONS_ENABLED: "1"
      INTERVENTION_SCAN_INTERVAL_SEC: "60"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [staging]

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_APP_ENTRY_URL: ${VITE_APP_ENTRY_URL:-/login}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?set STAGING_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [staging]

networks:
  staging:

volumes:
  # Deliberately not staging_postgres: never attach Go to an existing Express PG volume.
  staging_go_postgres:
  staging_media:
  caddy_data:
  caddy_config:
