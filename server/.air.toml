# Air 热重载配置
# 安装: go install github.com/air-verse/air@latest
# 用法: make dev（或直接运行 air）

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  bin = "./bin/DietDigiDose"
  cmd = "go build -o ./bin/DietDigiDose ./cmd/..."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "logs", "data", "docker", "docs", "migrations", "scripts", "i18n"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal", "configs"]
  include_ext = ["go", "yaml", "yml", "env"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
