packages:
  - client
  - server
  - admin
  - packages/*

allowUnusedPatches: true

allowBuilds:
  '@alicloud/openapi-core': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true

auditConfig:
  ignoreCves:
