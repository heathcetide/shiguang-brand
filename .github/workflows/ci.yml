name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: go_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-go-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d go_runtime_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GO_TEST_POSTGRES_URL: postgresql://postgres:isolated-go-ci-only@127.0.0.1:5432/go_runtime_test
      GO_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Vet primary runtime and every internal business package
        run: go -C server-go vet ./cmd/... ./internal/...
      - name: SQLite and isolated PostgreSQL regressions (no PG skips)
        run: go -C server-go test -race -count=1 -coverprofile=coverage.out ./cmd/... ./internal/...
      - name: Build the deployed executable without CGO
        run: CGO_ENABLED=0 go -C server-go build -trimpath -o bin/server ./cmd/server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Drive the real Go HTTP process and isolated core loop
        run: node scripts/smoke-go-runtime.mjs
      - name: Build the actual Go deployment image
        run: docker build --build-arg SERVER_GIT_SHA="$GITHUB_SHA" -t dietdigidose-go-ci -f server-go/docker/Dockerfile .
      - name: Check deployment wiring and container startup
        env:
          CANDIDATE_GIT_SHA: ${{ github.sha }}
          SERVER_ENV_FILE: server.env.example
        run: |
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.staging.yml config --quiet
          docker volume create go-ci-sqlite
          docker run --rm -v go-ci-sqlite:/data -e APP_DATABASE_DRIVER=sqlite -e APP_DATABASE_DSN=/data/smoke.db dietdigidose-go-ci -migrate
          docker run -d --name go-runtime-ci -v go-ci-sqlite:/data -p 127.0.0.1:19090:9090 -e APP_DATABASE_DRIVER=sqlite -e APP_DATABASE_DSN=/data/smoke.db -e JWT_SECRET=isolated-ci-only-not-an-application-secret -e REQUIRE_HTTPS=0 dietdigidose-go-ci
          trap 'docker logs go-runtime-ci; docker rm -f go-runtime-ci; docker volume rm go-ci-sqlite' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:19090/api/v1/health
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-runtime-coverage
          path: server-go/coverage.out
          if-no-files-found: warn

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm -w validate:toolchain
      - run: pnpm -w docs:check
      - run: pnpm -w test:docs
      - run: pnpm install --frozen-lockfile
      - name: Verify base-data evidence and reproducible build
        run: |
          python3 datasets/base-data/build.py --download --output-dir "$RUNNER_TEMP/base-data-rebuild"
          curl --fail --location --retry 2 https://github.com/user-attachments/files/31905208/dietdigidose-base-data-0.1.0-rc.7.zip --output "$RUNNER_TEMP/base-data-rc7.zip"
          python3 datasets/base-data/verify.py "$RUNNER_TEMP/base-data-rc7.zip"
          DDD_BASE_DATA_RC7_ARCHIVE="$RUNNER_TEMP/base-data-rc7.zip" python3 -m unittest discover -s datasets/base-data -p 'test_*.py' -v
      - run: pnpm -w validate:release
      - run: pnpm -w contracts:check
      - run: pnpm -w provider:smoke
      - run: pnpm -w quality:test-quarantine
      - run: pnpm -w lint:all
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - run: pnpm -w test:all
      - run: pnpm -w test:coverage
      - run: pnpm -w build:client
      - run: pnpm -w build:go
      - run: pnpm -w build:admin
      - run: pnpm -w quality:build-budgets
      - run: pnpm -w audit:prod

  stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - run: pnpm -w test:stability
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-stability-${{ github.sha }}
          path: artifacts/quality/test-stability.json
          if-no-files-found: error
          retention-days: 14

  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm -w validate:toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w validate:release
      - run: pnpm -w quality:test-quarantine
      - run: pnpm -w lint:all
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - run: pnpm -w test:all
      - run: pnpm -w build:client
      - run: pnpm -w build:go
      - run: pnpm -w build:admin
      - run: pnpm -w quality:build-budgets
      - run: pnpm -w audit:prod

  ai-runtime-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: AI domain and admin AI-config regressions
        run: go -C server-go test -count=1 ./internal/domains/ai/... ./internal/domains/admin/...
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Admin and client notification regressions
        run: |
          pnpm --dir admin test
          pnpm --dir client exec jest utils/notifications.test.ts contexts/AuthContext.test.tsx --runInBand
