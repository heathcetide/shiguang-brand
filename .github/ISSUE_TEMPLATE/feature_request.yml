name: 功能建议
description: 提交经过初步思考的产品能力或流程改进
title: "feat: "
labels:
  - enhancement
  - needs-design
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 描述目标用户、使用场景和当前痛点，不要只描述解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明核心流程和用户可见行为。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 最小可行范围
      description: 首期必须包含什么？哪些内容明确不包含？
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: 验收标准与成功指标
      description: 写出可验证结果，以及如何判断该功能产生了真实价值。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖、风险与隐私考虑
      description: 可引用相关 Issue，例如“Blocked by #123”。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和产品路线图，未发现重复建议。
          required: true
        - label: 该建议描述了用户问题、最小范围和可验证结果。
          required: true

