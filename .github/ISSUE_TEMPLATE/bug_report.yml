name: 缺陷报告
description: 报告可复现的客户端、服务端、管理端或发布问题
title: "bug: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        请避免提交密钥、访问令牌、完整手机号、健康资料或其他敏感信息。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 简洁说明发生了什么以及造成的影响。
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 影响范围
      options:
        - Android 客户端
        - Web 客户端
        - Web 管理端
        - 服务端 / API / 数据库
        - CI / 构建 / 发布
        - 多端或暂不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与构建号
      placeholder: 例如 1.0.6 / 263601 / Git SHA
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或脱敏日志
      description: 可拖入附件；日志必须先移除令牌、账号和个人数据。
  - type: dropdown
    id: priority
    attributes:
      label: 建议优先级
      description: 最终优先级由维护者确认。
      options:
        - P0 - 发布或核心流程阻断 / 安全问题
        - P1 - 高影响且需要近期解决
        - P2 - 一般问题
        - P3 - 低影响或体验优化
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现重复问题。
          required: true
        - label: 我没有提交密钥、令牌或未经脱敏的个人数据。
          required: true

